name: Refactor checks

on:
  pull_request:
  push:
    branches:
      - refactor/split-large-files

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
      - name: Lint (legacy issues reported, non-blocking)
        continue-on-error: true
        run: npm run lint
